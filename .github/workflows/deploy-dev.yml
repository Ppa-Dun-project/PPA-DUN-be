name: Deploy Backend to Dev Server

on:
  push:
    branches:
      - develop

env:
  GCP_ZONE: us-east1-b
  IMAGE: us-east1-docker.pkg.dev/v1-mvp/be-dev/be

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: be
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_NAME: test
        run: python -m pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Dev Server
        run: |
          gcloud compute ssh ${{ secrets.DEV_INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="sudo gcloud auth configure-docker us-east1-docker.pkg.dev --quiet && \
                       sudo docker pull ${{ env.IMAGE }}:latest && \
                       sudo git config --global --add safe.directory /app/cl && \
                       cd /app/cl && sudo git pull origin main && \
                       cd /app/cl/dev && sudo docker compose up -d be"

  notify:
    needs: deploy
    if: always()
    uses: ./.github/workflows/discord-deploy-notify.yml
    with:
      status: ${{ needs.deploy.result }}
      service: Backend
    secrets:
      DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
